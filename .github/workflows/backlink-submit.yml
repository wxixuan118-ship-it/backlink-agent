name: Backlink Directory Submission

on:
  # 每周一 UTC 09:00 自动运行
  schedule:
    - cron: "0 9 * * 1"

  # 手动触发
  workflow_dispatch:
    inputs:
      site_slug:
        description: "目标站点 slug（留空 = 所有站点并行）"
        required: false
        default: ""
      only:
        description: "只提交指定 directory（逗号分隔，留空 = 全部）"
        required: false
        default: ""
      force:
        description: "强制重新提交已提交过的 directory"
        type: boolean
        default: false
      dry_run:
        description: "只打印，不实际提交"
        type: boolean
        default: false

jobs:
  # ── 1. 准备：更新 directory 类型 + 生成站点矩阵 ─────────────────
  setup:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      slugs: ${{ steps.matrix.outputs.slugs }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update directory types
        run: cd scripts && python update_types.py

      - name: Commit config changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/submission_config.yaml
          git diff --staged --quiet && exit 0
          git commit -m "chore: auto-update directory types [$(date -u +%Y-%m-%d)]"
          git pull --rebase origin main
          git push

      - name: Build site matrix
        id: matrix
        run: |
          if [ -n "${{ github.event.inputs.site_slug }}" ]; then
            echo 'slugs=["${{ github.event.inputs.site_slug }}"]' >> "$GITHUB_OUTPUT"
          else
            python3 -c "
          import yaml, json, sys
          with open('config/sites.yaml') as f:
              sites = yaml.safe_load(f).get('sites', [])
          if not sites:
              print('slugs=[]', file=open('/dev/stderr', 'w'))
              sys.exit(1)
          print('slugs=' + json.dumps([s['slug'] for s in sites]))
          " >> "$GITHUB_OUTPUT"
          fi

  # ── 2. 并行提交：每个站点独立的 job ────────────────────────────
  submit:
    name: Submit — ${{ matrix.slug }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      matrix:
        slug: ${{ fromJson(needs.setup.outputs.slugs) }}
      fail-fast: false   # 一个站点失败不影响其他站点

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main   # 拉最新（含 setup job 提交的 type 更新）

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Playwright browsers
        continue-on-error: true
        run: playwright install chromium --with-deps

      - name: Build submission flags
        id: flags
        run: |
          FLAGS="--site '${{ matrix.slug }}'"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "${{ github.event.inputs.force }}"   = "true" ]; then FLAGS="$FLAGS --force";   fi
          if [ -n "${{ github.event.inputs.only }}"           ]; then FLAGS="$FLAGS --only '${{ github.event.inputs.only }}'"; fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Run submission script
        continue-on-error: true
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
        run: cd scripts && python submit.py ${{ steps.flags.outputs.flags }}

      - name: Generate report
        if: always()
        run: cd scripts && python generate_report.py --site '${{ matrix.slug }}'

      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --staged --quiet && exit 0
          git commit -m "chore: update results [${{ matrix.slug }}] [$(date -u +%Y-%m-%d)]"
          # 并行 job 同时 push 可能冲突，最多重试 5 次
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in a moment..."
            sleep $((RANDOM % 15 + 5))
          done

      - name: Post to Job Summary
        if: always()
        run: |
          if [ -f "results/${{ matrix.slug }}/report.md" ]; then
            echo "## ${{ matrix.slug }}" >> "$GITHUB_STEP_SUMMARY"
            cat "results/${{ matrix.slug }}/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.slug }}-${{ github.run_number }}
          path: results/${{ matrix.slug }}/
          retention-days: 30

  # ── 3. 汇总通知：所有站点完成后发邮件 ──────────────────────────
  notify:
    name: Email notification
    needs: submit
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 拉最新（含所有 submit job 提交的结果）

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate combined report
        run: cd scripts && python generate_report.py

      - name: Send email report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Backlink 提交报告 [${{ needs.submit.result }}] — Run #${{ github.run_number }}"
          to: wxixuan118@gmail.com
          from: "Backlink Agent <${{ secrets.MAIL_USERNAME }}>"
          body: |
            所有站点提交任务已完成。

            整体结果：${{ needs.submit.result }}
            触发方式：${{ github.event_name }}

            详细报告：
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          html_body: file://results/report.md
          convert_markdown: true
