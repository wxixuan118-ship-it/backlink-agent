    notes: "Submit sitemap at Bing Webmaster Tools — requires Microsoft account"

# ============================================================
# 运行设置
# ============================================================
settings:
  request_delay_seconds: 3       # 每次提交之间的间隔（秒）
  request_timeout_seconds: 20    # 单次请求超时
  max_retries: 2                 # 失败重试次数
  skip_already_submitted: true   # 跳过已提交过的 directory
  results_file: "results/submission_log.json"
